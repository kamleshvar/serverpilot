<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ status_code }} · {{ app_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brand/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/brand/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="error-shell">
    <a class="brand" href="{{ url_for('public.index') }}">
      <span class="brand-mark" aria-hidden="true">
        <img src="{{ url_for('static', filename='images/brand/techorigin-mark.png') }}" alt="" width="512" height="512">
      </span>
      <span>{{ app_name }}</span>
    </a>
    <p class="error-code">{{ status_code }}</p>
    <h1>{{ message }}</h1>
    <p class="error-meta">Reference: {{ error_code }}</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/">Return home</a>
      <a class="btn btn-ghost" href="/healthz">Service status</a>
    </div>
  </main>
</body>
</html>
